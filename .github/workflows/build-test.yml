
name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # Node 22 is Maintenance LTS, 24 is Active LTS and 26 is Current.
        # Everything earlier is end of life and no longer receives patches.
        node-version: [22.x, 24.x, 26.x]
        # The addon is compiled on the user machine, so the compiler differs
        # per platform. Windows in particular was the reason this project
        # exists and is the most likely place for a build to break.
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: node ${{ matrix.node-version }} on ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # The node-gyp npm bundles varies by Node release: 22 ships 11, which only
    # recognises Visual Studio major versions 15 to 17 and cannot see the 2026
    # install on the Windows runners. Installing without scripts and invoking
    # the pinned devDependency directly makes the toolchain identical on every
    # matrix entry. npm has no node-gyp config key to point at instead.
    - name: Install dependencies without building
      run: npm ci --ignore-scripts
    - name: Compile the addon with the pinned node-gyp
      run: npx node-gyp rebuild
    - name: Run ESLint
      run: npm run lint
    - name: Compile TypeScript
      run: npm run build --if-present
    - name: Run tests
      run: npm test
