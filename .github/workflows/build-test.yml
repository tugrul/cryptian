
name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        # Node 22 is Maintenance LTS, 24 is Active LTS and 26 is Current.
        # Everything earlier is end of life and no longer receives patches.
        node-version: [22.x, 24.x, 26.x]
        # The addon is compiled on the user machine, so the compiler differs
        # per platform. Windows in particular was the reason this project
        # exists and is the most likely place for a build to break.
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: node ${{ matrix.node-version }} on ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # npm bundles node-gyp 11, whose Visual Studio detection only knows major
    # versions 15 to 17. The Windows runners now ship Visual Studio 2026, which
    # reports major version 18, so the bundled copy fails with
    # 'unknown version "undefined"' before it reaches the compiler. node-gyp 13
    # added major 18 and the v145 toolset. Point npm at that instead.
    - name: Use a node-gyp that recognises Visual Studio 2026
      shell: bash
      run: |
        npm install -g node-gyp@latest
        echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
    - name: Install dependencies and compile the addon
      run: npm ci
    - name: Run ESLint
      run: npm run lint
    - name: Compile TypeScript
      run: npm run build --if-present
    - name: Run tests
      run: npm test
